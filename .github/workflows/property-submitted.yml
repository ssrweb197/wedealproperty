name: Update property listings

on:
  repository_dispatch:
    types: [property_submitted]

permissions:
  contents: write

jobs:
  update-properties:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Update properties.json
        env:
          PAYLOAD: ${{ toJson(github.event.client_payload) }}
        run: |
          node <<'NODE'
          const fs = require('fs');
          const path = 'data/properties.json';
          const payload = JSON.parse(process.env.PAYLOAD);
          let properties = [];
          if (fs.existsSync(path)) {
            const text = fs.readFileSync(path, 'utf8').trim();
            if (text) properties = JSON.parse(text);
          }

          const firstPhoto = Array.isArray(payload.photos)
            ? (payload.photos[0] || '')
            : String(payload.photos || '').split(/[,\n]/)[0].trim();

          const property = {
            id: payload.id || payload.submission_id || String(Date.now()),
            title: payload.title || '',
            listingType: payload.listing_type || payload.listingType || payload.purpose || '',
            propertyType: payload.property_type || payload.propertyType || payload.type || '',
            location: payload.location || '',
            price: payload.price_or_rent || payload.price || '',
            bhk: payload.bhk || '',
            area: payload.size_sq_ft || payload.area || '',
            furnishing: payload.furnishing || '',
            description: payload.description || '',
            photos: payload.photos || '',
            image: firstPhoto,
            phone: payload.phone || '',
            email: payload.email || '',
            submittedAt: new Date().toISOString()
          };

          properties.push(property);
          fs.writeFileSync(path, JSON.stringify(properties, null, 2) + '\n');
          NODE

      - name: Commit property listing
        run: |
          git config user.name "WeDealProperty Bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/properties.json
          git diff --cached --quiet && exit 0
          git commit -m "Add property listing"
          git push
