name: Update property listings

on:
  repository_dispatch:
    types: [property_submitted]

permissions:
  contents: write

jobs:
  update-properties:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Update properties.json
        env:
          PAYLOAD: ${{ toJson(github.event.client_payload) }}
        run: |
          node <<'NODE'
          const fs = require('fs');
          const path = 'data/properties.json';
          const payload = JSON.parse(process.env.PAYLOAD);
          let properties = [];
          if (fs.existsSync(path)) {
            const text = fs.readFileSync(path, 'utf8').trim();
            if (text) properties = JSON.parse(text);
          }

          const cleanKey = k => String(k || '').toLowerCase().replace(/[^a-z0-9]/g, '');
          const all = Object.assign({}, payload, payload.answers || {}, payload.fields || {});
          const pick = (...names) => {
            for (const name of names) {
              const wanted = cleanKey(name);
              for (const [key, value] of Object.entries(all)) {
                if (cleanKey(key) === wanted || cleanKey(key).includes(wanted)) {
                  if (value !== undefined && value !== null && String(value).trim() !== '') return value;
                }
              }
            }
            return '';
          };

          const photoValue = pick('photos','photo','image','propertyphotos','propertyphotosuploadimagesofyourproperty');
          const photoList = Array.isArray(photoValue)
            ? photoValue
            : String(photoValue || '').split(/[,\n]/).map(x => x.trim()).filter(Boolean);

          const property = {
            id: pick('id','submissionid') || String(Date.now()),
            title: pick('title','propertytitle'),
            listingType: pick('listingtype','listing_type','purpose','propertylistingtype'),
            propertyType: pick('propertytype','property_type','type'),
            location: pick('location','locationareaorcity','locationareacity'),
            price: pick('priceorrent','price_or_rent','price','expectedpriceormonthlyrentinlocalcurrency'),
            bhk: pick('bhk','bedrooms','numberofbedroomsifapplicable'),
            area: pick('size_sq_ft','areasqft','area','propertysize'),
            furnishing: pick('furnishing','furnishingstatus'),
            description: pick('description','propertydescription'),
            photos: photoList,
            image: photoList[0] || '',
            phone: pick('phone','phonenumber'),
            email: pick('email','emailaddress'),
            submittedAt: new Date().toISOString()
          };

          properties.push(property);
          fs.writeFileSync(path, JSON.stringify(properties, null, 2) + '\n');
          NODE

      - name: Commit property listing
        run: |
          git config user.name "WeDealProperty Bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/properties.json
          git diff --cached --quiet && exit 0
          git commit -m "Improve Jotform property field mapping"
          git push
