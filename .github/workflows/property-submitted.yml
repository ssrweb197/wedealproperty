name: Update property listings

on:
  repository_dispatch:
    types: [property_submitted]

permissions:
  contents: write

jobs:
  update-properties:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Update properties.json
        env:
          PAYLOAD: ${{ toJson(github.event.client_payload) }}
        run: |
          node <<'NODE'
          const fs = require('fs');
          const path = 'data/properties.json';
          const payload = JSON.parse(process.env.PAYLOAD);
          let properties = [];
          if (fs.existsSync(path)) {
            const text = fs.readFileSync(path, 'utf8').trim();
            if (text) properties = JSON.parse(text);
          }

          // Accept nested property data and raw Jotform fields at either payload level.
          const data = payload.property && typeof payload.property === 'object' ? payload.property : payload;
          const cleanKey = k => String(k || '').toLowerCase().replace(/[^a-z0-9]/g, '');
          const all = Object.assign(
            {},
            payload,
            payload.answers || {},
            payload.fields || {},
            data,
            data.answers || {},
            data.fields || {}
          );
          // Jotform can send each answer as an object like {name, text, answer}.
          // Flatten those answer objects so file-upload URLs are discoverable by field name/ID.
          const flattenAnswers = (value, depth = 0) => {
            if (!value || typeof value !== 'object' || depth > 8) return;
            if (Array.isArray(value)) { value.forEach(v => flattenAnswers(v, depth + 1)); return; }
            const answer = value.answer;
            if (answer !== undefined && answer !== null) {
              for (const alias of [value.name, value.text, value.id, value.question, value.fieldName]) {
                if (alias) all[String(alias)] = answer;
              }
            }
            for (const [key, child] of Object.entries(value)) {
              if (child && typeof child === 'object') flattenAnswers(child, depth + 1);
              else if (child !== undefined && child !== null && /^q\\d+_/i.test(key)) all[key] = child;
            }
          };
          flattenAnswers(payload);
          const pick = (...names) => {
            for (const name of names) {
              const wanted = cleanKey(name);
              for (const [key, value] of Object.entries(all)) {
                if (cleanKey(key) === wanted || cleanKey(key).includes(wanted)) {
                  if (value !== undefined && value !== null && String(value).trim() !== '') return value;
                }
              }
            }
            return '';
          };

          const photoValue = pick('photos', 'photo', 'image', 'propertyphotos', 'propertyphotosuploadimagesofyourproperty', 'q14_fileupload12', 'q14_q14_fileupload12', 'fileupload12');
          const photoList = [];
          const addPhotoUrls = (value, depth = 0) => {
            if (value == null || depth > 10) return;
            if (Array.isArray(value)) { value.forEach(v => addPhotoUrls(v, depth + 1)); return; }
            if (typeof value === 'object') {
              for (const key of ['url', 'download_url', 'downloadUrl', 'file_url', 'fileUrl', 'answer', 'value', 'files']) {
                if (value[key] !== undefined) addPhotoUrls(value[key], depth + 1);
              }
              return;
            }
            const matches = String(value).trim().match(/https?:\/\/[^\s"'<>]+/gi) || [];
            for (const url of matches) {
              if (/jotform\.com\/uploads\//i.test(url) || /\.(jpe?g|png|webp|gif)(?:[?#]|$)/i.test(url)) photoList.push(url.replace(/[),;]+$/, ''));
            }
          };
          addPhotoUrls(photoValue);
          // Fallback for Zoho tokens that serialize the URL under an unexpected field name.
          if (!photoList.length) addPhotoUrls(payload);
          const uniquePhotos = [...new Set(photoList)];

          const property = {
            id: pick('id', 'submissionid', 'submissionID'),
            title: pick('title', 'propertytitle', 'q7_textbox5', 'q7_q7_textbox5'),
            listingType: pick('listingtype', 'listing_type', 'purpose', 'propertylistingtype', 'q5_radio3', 'q5_q5_radio3'),
            propertyType: pick('propertytype', 'property_type', 'type', 'q6_dropdown4', 'q6_q6_dropdown4'),
            location: pick('location', 'locationareaorcity', 'locationareacity', 'q8_textbox6', 'q8_q8_textbox6'),
            price: pick('priceorrent', 'price_or_rent', 'price', 'expectedpriceormonthlyrentinlocalcurrency', 'q9_number7', 'q9_q9_number7'),
            bhk: pick('bhk', 'bedrooms', 'numberofbedroomsifapplicable', 'q11_number9', 'q11_q11_number9'),
            area: pick('size_sq_ft', 'areasqft', 'area', 'propertysize', 'q10_number8', 'q10_q10_number8'),
            furnishing: pick('furnishing', 'furnishingstatus', 'q12_radio10', 'q12_q12_radio10'),
            description: pick('description', 'propertydescription', 'q13_textarea11', 'q13_q13_textarea11'),
            photos: uniquePhotos,
            image: uniquePhotos[0] || '',
            phone: pick('phone', 'phonenumber', 'q3_phone1', 'q3_q3_phone1'),
            email: pick('email', 'emailaddress', 'q4_email2', 'q4_q4_email2'),
            submittedAt: new Date().toISOString()
          };

          // Do not publish an empty test submission as a property listing.
          if (!String(property.title || '').trim() || !String(property.location || '').trim()) {
            throw new Error('Property title/location missing in GitHub dispatch payload. Check that Zoho Flow sends the mapped Jotform values.');
          }
          if (!property.id) property.id = String(Date.now());

          properties.push(property);
          fs.writeFileSync(path, JSON.stringify(properties, null, 2) + '\n');
          console.log('Saved property listing:', JSON.stringify({
            id: property.id,
            title: property.title,
            location: property.location,
            hasPhone: Boolean(String(property.phone || '').trim()),
            hasEmail: Boolean(String(property.email || '').trim()),
            photoCount: uniquePhotos.length,
            photoFieldType: Array.isArray(photoValue) ? 'array' : typeof photoValue
          }));
          NODE

      - name: Commit property listing
        run: |
          git config user.name "WeDealProperty Bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/properties.json
          git diff --cached --quiet && exit 0
          git commit -m "Improve Jotform property field mapping"
          git push
