<!doctype html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>All Properties | WeDealProperty</title><meta name="description" content="Browse all available properties listed on WeDealProperty."><link rel="stylesheet" href="styles.css"></head><body><header class="nav"><div class="nav-inner"><a class="brand" href="index.html" style="text-decoration:none;color:inherit"><span class="logo">W</span><span>WeDeal<span class="gold">Property</span></span></a><a class="owner-btn" href="https://form.jotform.com/262791670572061" target="_blank">Post Property Free</a></div></header><main><section class="section" style="padding-top:55px"><div class="section-top"><div><small class="kicker">PROPERTY LISTINGS</small><h1 style="margin:0 0 8px;font-size:38px">All Properties</h1><p>Find the right property using simple filters.</p></div><a href="index.html" class="all-properties-btn">← Back Home</a></div><div class="property-filter-box"><div class="filter-heading"><strong>🔎 Find Your Property</strong><span id="filterResult">All properties</span><button id="resetFilters" type="button">Reset Filters</button></div><div class="property-filters"><label><span>PROPERTY TYPE</span><select id="filterType"><option value="">All Types</option><option value="Apartment/Flat">Flat / Apartment</option><option value="House">House</option><option value="Villa">Villa</option><option value="Plot">Plot</option><option value="Commercial">Commercial</option></select></label><label><span>BHK</span><select id="filterBhk"><option value="">Any BHK</option><option value="1">1 BHK</option><option value="2">2 BHK</option><option value="3">3 BHK</option><option value="4">4+ BHK</option></select></label><label><span>MAX COST</span><select id="filterBudget"><option value="0">Any Budget</option><option value="2500000">Under ₹25 Lakh</option><option value="5000000">Under ₹50 Lakh</option><option value="10000000">Under ₹1 Crore</option><option value="20000000">Under ₹2 Crore</option><option value="50000000">Under ₹5 Crore</option><option value="999999999999">₹5 Crore+</option></select></label><label><span>LOCATION</span><select id="filterLocation"><option value="">All Locations</option><option>Hyderabad</option><option>Secunderabad</option><option>Gachibowli</option><option>Kondapur</option><option>Madhapur</option><option>Kukatpally</option><option>Miyapur</option><option>Manikonda</option></select></label><button id="applyFilters" type="button" class="filter-apply">Show Properties</button></div><div class="quick-filter-row"><span>Quick:</span><button type="button" data-type="Apartment/Flat" data-bhk="2">2 BHK Flats</button><button type="button" data-type="Apartment/Flat" data-bhk="3">3 BHK Flats</button><button type="button" data-type="Plot">Plots</button><button type="button" data-budget="5000000">Under ₹50 Lakh</button><button type="button" data-budget="10000000">Under ₹1 Crore</button></div></div><div id="allPageCards" class="grid"><div class="loading">Loading properties…</div></div></section></main><script>
var allProperties=[];
function esc(v){return String(v||"").replace(/[&<>"]/g,function(c){return {"&":"&amp;","<":"&lt;",">":"&gt;","\"":"&quot;"}[c]})}
function priceNumber(v){var s=String(v||"").toLowerCase().replace(/,/g,""),n=parseFloat(s.replace(/[^0-9.]/g,""));if(!isFinite(n))return 0;if(s.indexOf("crore")>=0||s.indexOf("cr")>=0)return n*10000000;if(s.indexOf("lakh")>=0||s.indexOf("lac")>=0)return n*100000;return n}
function typeOf(p){var t=String(p.type||"").toLowerCase();if(t.indexOf("flat")>=0||t.indexOf("apartment")>=0)return "Apartment/Flat";if(t.indexOf("plot")>=0||t.indexOf("land")>=0)return "Plot";if(t.indexOf("villa")>=0)return "Villa";if(t.indexOf("house")>=0)return "House";if(t.indexOf("commercial")>=0||t.indexOf("shop")>=0||t.indexOf("office")>=0)return "Commercial";return p.type||""}
function matches(p){var t=document.getElementById("filterType").value,b=document.getElementById("filterBhk").value,c=Number(document.getElementById("filterBudget").value),l=document.getElementById("filterLocation").value.toLowerCase(),pt=typeOf(p),pb=String(p.bhk||"").replace(/\s/g,""),price=priceNumber(p.price);if(t&&pt!==t)return false;if(l&&String(p.location||"").toLowerCase().indexOf(l)<0)return false;if(b){var n=parseInt(pb,10);if(!isFinite(n)||(b==="4"?n<4:n!==Number(b)))return false}if(c&&(c===999999999999?(price<50000000):(!price||price>c)))return false;return true}
function card(p){var photo=p.image?'<img src="'+esc(p.image)+'" alt="'+esc(p.title)+'" style="width:100%;height:100%;object-fit:cover">':"Property photo",meta="📍 "+esc(p.location||"Hyderabad");if(p.bhk)meta+="<br>🛏 "+esc(p.bhk)+" BHK · ";if(p.area)meta+="📐 "+esc(p.area)+" SFT";return '<article class="card"><div class="photo">'+photo+'</div><div class="card-body"><span class="tag">'+esc(typeOf(p)||"Property")+'</span><h3>'+esc(p.title||"Property")+'</h3><div class="meta">'+meta+'</div><div class="price">'+esc(p.price||"Price on request")+'</div><a class="contact" href="index.html?property='+encodeURIComponent(p.id)+'">View Property →</a></div></article>'}
function render(){var list=allProperties.filter(matches);document.getElementById("filterResult").textContent=list.length+" propert"+(list.length===1?"y":"ies")+" found";document.getElementById("allPageCards").innerHTML=list.length?list.map(card).join(""):'<div class="loading">No properties match these filters. Try changing the filters.</div>'}
function reset(){document.getElementById("filterType").value="";document.getElementById("filterBhk").value="";document.getElementById("filterBudget").value="0";document.getElementById("filterLocation").value="";render()}
["filterType","filterBhk","filterBudget","filterLocation"].forEach(function(id){document.getElementById(id).onchange=render});document.getElementById("applyFilters").onclick=render;document.getElementById("resetFilters").onclick=reset;document.querySelectorAll(".quick-filter-row button").forEach(function(x){x.onclick=function(){if(x.dataset.type!==undefined)document.getElementById("filterType").value=x.dataset.type;if(x.dataset.bhk!==undefined)document.getElementById("filterBhk").value=x.dataset.bhk;if(x.dataset.budget!==undefined)document.getElementById("filterBudget").value=x.dataset.budget;render()}});
fetch("./data/properties.json?ts="+Date.now(),{cache:"no-store"}).then(function(r){return r.json()}).then(function(data){var list=Array.isArray(data)?data:(data.properties||[]);allProperties=list.map(function(p){var photo=p.image||"";if(!photo&&p.photos)photo=Array.isArray(p.photos)?(p.photos[0]||""):String(p.photos).split(/[,\n]/)[0].trim();return{id:p.id||p.submission_id||"",title:String(p.title||"Property").trim()||"Property",location:String(p.location||"Hyderabad").trim(),type:String(p.propertyType||p.property_type||p.type||"").trim(),price:String(p.price||p.price_or_rent||"").trim(),bhk:String(p.bhk||"").trim(),area:String(p.area||p.size_sq_ft||"").trim(),image:photo}}).filter(function(p){return p.title!=="Property"||p.location||p.price||p.image});render()}).catch(function(){document.getElementById("allPageCards").innerHTML='<div class="loading">Unable to load properties right now.</div>'});
</script></body></html>
