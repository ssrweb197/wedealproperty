<!doctype html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>All Properties | WeDealProperty</title><meta name="description" content="Browse all available properties listed on WeDealProperty."><link rel="stylesheet" href="styles.css"></head><body><header class="nav"><div class="nav-inner"><a class="brand" href="index.html" style="text-decoration:none;color:inherit"><span class="logo">W</span><span>WeDeal<span class="gold">Property</span></span></a><a class="owner-btn" href="https://form.jotform.com/262791670572061" target="_blank">Post Property Free</a></div></header><main><section class="section" style="padding-top:55px"><div class="section-top"><div><small class="kicker">PROPERTY LISTINGS</small><h1 style="margin:0 0 8px;font-size:38px">All Properties</h1><p>Browse all available property listings.</p></div><a href="index.html" class="all-properties-btn">← Back Home</a></div><div id="allPageCards" class="grid"><div class="loading">Loading properties…</div></div></section></main><script>
function esc(v){return String(v||"").replace(/[&<>"]/g,function(c){return {"&":"&amp;","<":"&lt;",">":"&gt;","\"":"&quot;"}[c]})}
function card(p){var photo=p.image?'<img src="'+esc(p.image)+'" alt="" style="width:100%;height:100%;object-fit:cover">':"Property photo";var meta="📍 "+esc(p.location||"Hyderabad");if(p.bhk)meta+="<br>🛏 "+esc(p.bhk)+" BHK · ";if(p.area)meta+="📐 "+esc(p.area)+" SFT";return '<article class="card"><div class="photo">'+photo+'</div><div class="card-body"><span class="tag">'+esc(p.type||"Property")+'</span><h3>'+esc(p.title||"Property")+'</h3><div class="meta">'+meta+'</div><div class="price">'+esc(p.price||"Price on request")+'</div><a class="contact" href="index.html?property='+encodeURIComponent(p.id)+'">View Property →</a></div></article>'}
fetch("./data/properties.json?ts="+Date.now(),{cache:"no-store"}).then(r=>r.json()).then(data=>{var list=Array.isArray(data)?data:(data.properties||[]);list=list.map(function(p){var photo=p.image||"";if(!photo&&p.photos)photo=Array.isArray(p.photos)?(p.photos[0]||""):String(p.photos).split(/[,\n]/)[0].trim();return{id:p.id||p.submission_id||"",title:String(p.title||"Property").trim()||"Property",location:String(p.location||"Hyderabad").trim(),type:String(p.propertyType||p.property_type||p.type||"").trim(),price:String(p.price||p.price_or_rent||"").trim(),bhk:String(p.bhk||"").trim(),area:String(p.area||p.size_sq_ft||"").trim(),image:photo}}).filter(function(p){return p.title!=="Property"||p.location||p.price||p.image});document.getElementById("allPageCards").innerHTML=list.length?list.map(card).join(""):"<div class=\"loading\">No properties found.</div>"}).catch(function(){document.getElementById("allPageCards").innerHTML="<div class=\"loading\">Unable to load properties right now.</div>"})
</script></body></html>
